name: Windows build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF app
        run: dotnet build src/DotaHelper/DotaHelper.csproj --configuration Release
      - name: Run engine smoke tests
        run: dotnet run --project tests/DotaHelper.SmokeTests/DotaHelper.SmokeTests.csproj --configuration Release
      - name: Publish standalone Windows EXE
        run: dotnet publish src/DotaHelper/DotaHelper.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/DotaHelper
      - name: Upload downloadable prototype
        uses: actions/upload-artifact@v4
        with:
          name: DotaHelper-0.6.1-win-x64
          path: artifacts/DotaHelper/
          if-no-files-found: error
          retention-days: 30
